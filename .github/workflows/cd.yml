name: CD

# Runs only after the CI workflow completed on main. Deployment steps are placeholders
# (Helm arrives in lab 09): nothing is really deployed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    # Never deploy a red or cancelled CI, and never code coming from a fork: the branch
    # filter above matches the branch NAME, so a fork PR from a branch called "main" would pass it.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to staging
        run: |
          echo "Deploying ${{ github.event.workflow_run.head_sha }} to staging"
          # helm upgrade --install ecommerce ./deploy/helm/ecommerce --namespace staging

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    # The approval is enforced by the protection rules of the "production" environment
    # on GitHub (required reviewers), not by this file.
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to production
        run: |
          echo "Deploying ${{ github.event.workflow_run.head_sha }} to production"
          # helm upgrade --install ecommerce ./deploy/helm/ecommerce --namespace production
