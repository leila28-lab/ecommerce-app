name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # dorny/test-reporter publishes a check run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ECommerce.slnx

      - name: Build
        run: dotnet build ECommerce.slnx -c Release --no-restore

      # Catalog tests use Testcontainers (PostgreSQL); Docker is preinstalled on ubuntu-latest.
      - name: Test
        run: >
          dotnet test ECommerce.slnx -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Test report
        if: always()
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        with:
          name: Tests
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: false

  migrations-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      # dotnet ef needs the project's NuGet assets (obj/project.assets.json).
      - name: Restore Catalog project
        run: dotnet restore src/ECommerce.Catalog.Api

      # Design-time factory never opens a connection: no database or secret needed.
      - name: Generate idempotent migration script
        run: >
          dotnet ef migrations script --idempotent
          --project src/ECommerce.Catalog.Api
          --output catalog-migrations.sql

      - name: Upload SQL script
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-migrations-sql
          path: catalog-migrations.sql
          if-no-files-found: error
